[project]
name = "kryten-cli"
version = "2.5.1"
description = "Command-line client for CyTube via kryten-py library"
readme = "README.md"
requires-python = ">=3.10"
keywords = [ "cytube", "nats", "cli", "command-line", "microservices", "bot",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Communications :: Chat", "Topic :: Utilities",]
dependencies = [ "kryten-py>=0.9.8",]
[[project.authors]]
name = "Kryten Robot Team"
email = "kryten@example.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "ruff>=0.1.0,<0.2.0", "mypy>=1.7.0,<2.0.0",]

[project.license]
text = "MIT"

[project.scripts]
kryten = "kryten_cli:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disable_error_code = [ "union-attr",]
[[tool.mypy.overrides]]
module = "kryten.*"
ignore_missing_imports = true

[tool.ruff.lint]
select = [ "E", "F", "W",]
ignore = [ "E501",]

[tool.hatch.build.targets.wheel]
packages = [ "kryten_cli.py",]
